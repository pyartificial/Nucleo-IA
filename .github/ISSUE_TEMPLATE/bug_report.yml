name: Reportar un problema
description: Informá un error de funcionamiento que no sea una vulnerabilidad de seguridad.
title: "[Problema]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No publiques claves API, contraseñas, correos privados ni registros sin revisar. Para informar una vulnerabilidad, consultá SECURITY.md y escribí por privado.
  - type: input
    id: version
    attributes:
      label: Versión o fecha de descarga
      placeholder: "Por ejemplo: publicación inicial"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - WSL
        - Otro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Contá qué hiciste, paso a paso. Quitá cualquier dato privado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que ocurriera
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué ocurrió
      description: Si pegás un mensaje de error, revisá antes que no contenga claves ni datos personales.
    validations:
      required: true
